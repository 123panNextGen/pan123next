name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # 校验：tag 推送场景下，必须保证 tag 指向的 commit 已合并入 main
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify tag on main
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tag commit is reachable from origin/main
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-list -n 1 "${GITHUB_REF}")
          echo "Tag commit: $TAG_COMMIT"
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_COMMIT=$(git rev-parse origin/main)
          echo "origin/main: $MAIN_COMMIT"
          if git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_COMMIT"; then
            echo "✅ Tag is on main, proceeding."
          else
            echo "❌ Tag $GITHUB_REF_NAME ($TAG_COMMIT) is not reachable from origin/main ($MAIN_COMMIT)."
            echo "Only tags pointing to commits on the main branch are eligible for release."
            exit 1
          fi

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [verify-tag]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.verify-tag.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: linux
            artifact: build/linux/x64/release/bundle/
            artifact_name: pan123next-linux
          - os: windows-latest
            target: windows
            artifact: build/windows/x64/runner/Release/
            artifact_name: pan123next-windows
          - os: macos-latest
            target: macos
            artifact: build/macos/Build/Products/Release/
            artifact_name: pan123next-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libsecret-1-dev \
          ninja-build

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [verify-tag]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.verify-tag.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: pan123next-apk
          path: build/app/outputs/apk/release/app-release.apk

  release:
    name: Create GitHub Release
    needs: [build, build-apk]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build-apk.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # 拉取完整历史与所有 tag，以便计算上一个版本 tag
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip
          uv sync

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            IS_PREVIEW="${{ github.event.inputs.preview }}"
            RELEASE_TITLE="${{ github.event.inputs.release_title }}"
            RELEASE_BODY="${{ github.event.inputs.release_body }}"
            AUTO_GENERATE="${{ github.event.inputs.auto_generate }}"
            CURRENT_TAG="v${VERSION}"
          else
            # 真实 tag 字面量，允许带 (pre) 后缀，例如 v1.0.4(pre) → 预览版
            CURRENT_TAG="${GITHUB_REF_NAME}"
            if [[ "$CURRENT_TAG" == *"(pre)" ]]; then
              IS_PREVIEW="true"
              # 剥离尾部 (pre) 与前缀 v，得到纯版本号
              VERSION="${CURRENT_TAG%\(pre\)}"
              VERSION="${VERSION#v}"
            else
              IS_PREVIEW="false"
              VERSION="${CURRENT_TAG#v}"
            fi
            RELEASE_TITLE="Pan123Next Release $VERSION"
            RELEASE_BODY=""
            AUTO_GENERATE="true"
          fi

          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          COMMIT_SHA="${{ github.sha }}"

          # 计算上一个 v* tag：优先取当前 tag commit 的祖先 tag；
          # 若当前 tag 尚未创建（手动触发场景），则取仓库内排序最新的 v* tag。
          PREV_TAG=""
          if git rev-parse -q --verify "refs/tags/$CURRENT_TAG" >/dev/null; then
            PREV_TAG=$(git describe --tags --abbrev=0 --match='v*' "$CURRENT_TAG^" 2>/dev/null || true)
          else
            PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          fi
          # 如果取到的就是当前版本，视为没有上一个 tag
          if [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            PREV_TAG=""
          fi
          echo "Previous tag resolved to: '${PREV_TAG}'"

          {
            echo "version=$VERSION"
            echo "title=$RELEASE_TITLE"
            echo "tag=$CURRENT_TAG"
            echo "is_preview=$IS_PREVIEW"
            echo "auto_generate=$AUTO_GENERATE"
            echo "build_date=$BUILD_DATE"
            echo "repo_url=$REPO_URL"
            echo "commit_sha=$COMMIT_SHA"
            echo "previous_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

          # release body 单独通过 multiline 输出
          {
            echo "release_body<<__EOF__"
            printf '%s\n' "$RELEASE_BODY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Generate ChangeLog
        if: steps.meta.outputs.auto_generate == 'true' && steps.meta.outputs.previous_tag != ''
        env:
          PREV_TAG: ${{ steps.meta.outputs.previous_tag }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          uv run script/gitlog.py "$PREV_TAG" "$TAG" > doc/ChangeLog.md
          echo "----- generated ChangeLog -----"
          cat doc/ChangeLog.md
          echo "----- end -----"

      - name: Render release notes
        id: notes
        env:
          REL_VERSION: ${{ steps.meta.outputs.version }}
          REL_TAG: ${{ steps.meta.outputs.tag }}
          REL_PRE: ${{ steps.meta.outputs.is_preview }}
          REL_AUTO: ${{ steps.meta.outputs.auto_generate }}
          REL_BODY: ${{ steps.meta.outputs.release_body }}
          REL_DATE: ${{ steps.meta.outputs.build_date }}
          REL_REPO: ${{ steps.meta.outputs.repo_url }}
          REL_COMMIT: ${{ steps.meta.outputs.commit_sha }}
          REL_PREV_TAG: ${{ steps.meta.outputs.previous_tag }}
        run: |
          set -euo pipefail

          PRE_FLAG=$([ "$REL_PRE" == "true" ] && echo "--pre" || echo "--no-pre")

          ARGS=(
            --file=doc/ReleaseTemplate.md
            --version="$REL_VERSION"
            --tag="$REL_TAG"
            "$PRE_FLAG"
            --commit="$REL_COMMIT"
            --repository="$REL_REPO"
            --date="$REL_DATE"
          )

          if [ -n "$REL_PREV_TAG" ]; then
            ARGS+=( --previous-tag="$REL_PREV_TAG" )
          fi

          if [ "$REL_AUTO" == "true" ] && [ -f doc/ChangeLog.md ]; then
            ARGS+=( --changelog-file=doc/ChangeLog.md )
          elif [ -n "$REL_BODY" ]; then
            ARGS+=( --message="$REL_BODY" )
          fi

          uv run script/formatRelease.py "${ARGS[@]}" > /tmp/release_body.md

          echo "body_file=/tmp/release_body.md" >> "$GITHUB_OUTPUT"
          echo "----- 渲染后的 release notes -----"
          cat /tmp/release_body.md
          echo "----- end -----"

      - name: Create artifacts
        run: |
          mkdir artifacts
          cp pan123next-apk/app-release.apk artifacts/Pan123Next-Android.apk
          zip -r artifacts/Pan123Next-Linux.zip pan123next-linux/
          zip -r artifacts/Pan123Next-Windows.zip pan123next-windows/
          zip -r artifacts/Pan123Next-macos.zip pan123next-macos/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ steps.notes.outputs.body_file }}
          files: |
            ./artifacts/*
          prerelease: ${{ steps.meta.outputs.is_preview == 'true' }}
          generate_release_notes: false
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
