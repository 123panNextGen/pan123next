name: pan123next
description: "Your cloud, always ready"
publish_to: 'none'
version: 0.1.5+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.2
  package_info_plus: ^9.0.1

  window_manager: ^0.5.1
  fluent_ui: ^4.15.1

  shared_preferences: ^2.5.5
  uuid: ^4.5.3

  fluentui_system_icons: ^1.1.273
  get: ^4.7.3

  path_provider: ^2.1.5
  # flutter_aria2: ^0.1.3
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/device.json
    - assets/image/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNFM/JetBrainsMonoNerdFontMono-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/JetBrainsMonoNFM/JetBrainsMonoNerdFontMono-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/JetBrainsMonoNFM/JetBrainsMonoNerdFontMono-Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/JetBrainsMonoNFM/JetBrainsMonoNerdFontMono-BoldItalic.ttf
          weight: 700
          style: italic